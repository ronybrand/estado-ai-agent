spring.application.name=estado-ai-agent

# Inclui o requestId (MDC, populado por CorrelationIdFilter) em todo log da
# aplicacao, para correlacionar logs da mesma requisicao entre camadas.
logging.pattern.level=%5p [%X{requestId}]
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# gemini-3.6-flash (usado antes) tem cota gratuita de so 20 requests/DIA.
# gemini-3.5-flash-lite tem 500 requests/dia no free tier - mesma familia,
# custo zero, cota que da pra operar um projeto de portfolio de verdade.
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Resolve o IP real do cliente a partir de X-Forwarded-For/X-Forwarded-Proto
# quando a aplicacao roda atras de um proxy/load balancer, em vez de confiar
# cegamente no header (o proprio Spring valida a cadeia de proxies).
server.forward-headers-strategy=framework

# URL base da API de estados. Sem valor padrao: deve ser definida via env var
# para nao expor infraestrutura interna no codigo-fonte.
estado.api.base-url=${ESTADO_API_BASE_URL}

# Timeouts do RestClient usado para chamar a API de estados
estado.api.connect-timeout-ms=3000
estado.api.read-timeout-ms=5000

# Chave exigida no header X-API-Key para acessar /ask
app.security.api-key=${ASK_API_KEY}

# Limita o numero total de chamadas de tool que o modelo pode fazer dentro de
# uma unica requisicao /ask, evitando amplificacao de custo/carga por request
# (ex.: o LLM entrando em loop chamando listEstados/getEstadoById repetidamente).
spring.ai.tools.limits.max-total-tool-calls=10
spring.ai.tools.limits.on-limit-exceeded=RETURN_ERROR_RESPONSE

# Limite de requisicoes por IP em /ask. Default calibrado para o free tier
# do Gemini (10 req/min); configuravel via env var para nao exigir
# recompilar a aplicacao ao ajustar em producao.
app.ratelimit.capacity-per-window=${ASK_RATE_LIMIT_CAPACITY:10}
app.ratelimit.window-minutes=${ASK_RATE_LIMIT_WINDOW_MINUTES:1}

# Expoe apenas health/info/metrics via Actuator - endpoints como env ou
# beans exporiam configuracao interna (ex.: GEMINI_API_KEY), e nao ha
# autenticacao dedicada pra /actuator/** (fora do escopo do ApiKeyAuthFilter,
# que so protege /ask). show-details=never evita vazar detalhes de cada
# health indicator (ex. stacktrace de falha de disco) para quem nao autenticou.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
